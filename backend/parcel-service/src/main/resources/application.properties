

spring.application.name=parcel-service

server.port=4002

# Neon PostgreSQL Database
spring.datasource.url=${PARCEL_DB_URL}
spring.datasource.username=${PARCEL_DB_USERNAME}
spring.datasource.password=${PARCEL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=parcel

# Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=parcel
spring.flyway.schemas=parcel
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Other Microservices
app.auth-url=http://localhost:4000
app.merchant-url=http://localhost:4001
app.frontend-url=http://localhost:3000

app.admin-url=http://localhost:4009



spring.flyway.ignore-migration-patterns=versioned:missing
spring.flyway.validate-on-migrate=false
