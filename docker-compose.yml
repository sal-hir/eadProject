services:
  
  auth-service:
    build: ./backend/auth-service
    image: swiftdrop-auth-service
    container_name: swiftdrop-auth-service

    environment:
      AUTH_DB_URL: ${AUTH_DB_URL}
      AUTH_MIGRATION_DB_URL: ${AUTH_MIGRATION_DB_URL}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/login/oauth2/code/google}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "4000:4000"
    networks:
      - swiftdrop-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:4000/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped



    # ==========================================
  # PARCEL SERVICE (NEW ADDED)
  # ==========================================
  parcel-service:
    build: ./backend/parcel-service
    image: swiftdrop-parcel-service
    container_name: swiftdrop-parcel-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      SPRING_DATASOURCE_URL: ${PARCEL_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${PARCEL_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${PARCEL_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-swiftdrop}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-swiftdrop_pass}
      AUTH_SERVICE_URL: http://auth-service:4000
      app.auth-url: http://auth-service:4000
    networks:
      - swiftdrop-network
    depends_on:
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

# ==========================================
  # COURIER SERVICE
  # ==========================================
  courier-service:
    build:
      context: ./backend/courier-service
      dockerfile: Dockerfile
    image: swiftdrop-courier-service
    container_name: swiftdrop-courier-service
    restart: unless-stopped
    ports:
      - "${COURIER_PORT:-4003}:4003"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      COURIER_PORT: 4003
      COURIER_DB_URL: ${COURIER_DB_URL}
      COURIER_DB_USER: ${COURIER_DB_USER}
      COURIER_DB_PASSWORD: ${COURIER_DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:4000
      UPLOAD_DIR: /app/uploads
    volumes:
      - courier_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      
    # ==========================================
  # MEMBER 8: ADMIN SERVICE (ADDED)
  # ==========================================
  admin-service:
    build: ./backend/admin-service
    image: swiftdrop-admin-service
    container_name: swiftdrop-admin-service
    restart: unless-stopped
    ports:
      - "${ADMIN_SERVICE_PORT:-4009}:4009"
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      DB_URL: ${ADMIN_DB_URL}
      DB_MIGRATION_URL: ${ADMIN_DB_MIGRATION_URL}
      DB_USERNAME: ${ADMIN_DB_USERNAME}
      DB_PASSWORD: ${ADMIN_DB_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:4000
      MERCHANT_SERVICE_URL: ${MERCHANT_SERVICE_URL:-http://localhost:4001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MERCHANT_SERVICE_TOKEN: ${MERCHANT_SERVICE_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4009/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    networks:
      - swiftdrop-network

  # ==========================================
  # MEMBER 7: DISPATCH SERVICE (IMAGE FIXED)
  # ==========================================
  dispatch-service:
    build: ./backend/dispatch-service
    image: swiftdrop-dispatch-service
    container_name: swiftdrop-dispatch-service
    restart: unless-stopped
    ports:
      - "${DISPATCH_SERVICE_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SPRING_DATASOURCE_URL: ${DISPATCH_DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DISPATCH_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DISPATCH_DB_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      # ... existing env vars ...
      COURIER_SERVICE_URL: http://courier-service:4003
      PARCEL_SERVICE_URL: http://parcel-service:4002
      AUTH_SERVICE_URL: http://auth-service:4000
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - swiftdrop-network
    depends_on:
      auth-service:
        condition: service_healthy
      parcel-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
        

  # ==========================================
  # LOCAL POSTGRES DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: swiftdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-8090}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-swiftdrop_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # FRONTEND (IMAGE FIXED)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-http://localhost:4009}
    image: swiftdrop-frontend
    container_name: swiftdrop-frontend
    ports:
      - "3000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      dispatch-service:
        condition: service_started
      admin-service:
        condition: service_healthy
    restart: unless-stopped

    

  # ==========================================
  # RABBITMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: swiftdrop-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-swiftdrop_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-network


volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
  auth_postgres_data:
  courier_uploads:
    driver: local

networks:
  swiftdrop-network:
    driver: bridge