spring.application.name=parcel-service

server.port=4002

# Neon PostgreSQL Database
spring.datasource.url=${PARCEL_DB_URL}
spring.datasource.username=${PARCEL_DB_USERNAME}
spring.datasource.password=${PARCEL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=parcel

# Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.default-schema=parcel
spring.flyway.schemas=parcel
spring.flyway.locations=classpath:db/migration
spring.flyway.ignore-migration-patterns=*:missing
spring.flyway.validate-on-migrate=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Other Microservices
app.auth-url=${AUTH_SERVICE_URL:http://localhost:4000}
app.merchant-url=${MERCHANT_SERVICE_URL:http://localhost:4001}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.admin-url=${ADMIN_SERVICE_URL:http://localhost:4009}

# RabbitMQ & Messaging Exchange Settings
spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:swiftdrop}
spring.rabbitmq.password=${RABBITMQ_PASS:swiftdrop_pass}

app.messaging.pricing-exchange=${PRICING_EXCHANGE:swiftdrop.pricing}
app.messaging.pricing-routing-key=${PRICING_ROUTING_KEY:pricing.updated}
app.messaging.pricing-queue=${PRICING_QUEUE:parcel.pricing.updates}

app.messaging.zone-exchange=${ZONE_EXCHANGE:swiftdrop.zones}
app.messaging.zone-routing-key=${ZONE_ROUTING_KEY:zone.updated}
app.messaging.zone-queue=${ZONE_QUEUE:parcel.zones.updates}

spring.cloud.compatibility-verifier.enabled=false

spring.rabbitmq.listener.simple.auto-startup=false

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.title=SwiftDrop Parcel Booking & Pricing Documentation
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
app.swagger.server-url=${PARCEL_SERVICE_URL:http://localhost:4002}
