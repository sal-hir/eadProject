spring:
  application:
    name: dispatch-service

  datasource:
    url: ${DISPATCH_DB_URL}
    username: ${DISPATCH_DB_USER}
    password: ${DISPATCH_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:swiftdrop}
    password: ${RABBITMQ_PASS:swiftdrop_pass}

server:
  port: ${DISPATCH_SERVICE_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER}

services:
  courier:
    url: ${COURIER_SERVICE_URL:http://courier-service:4003}
  parcel:
    url: ${PARCEL_SERVICE_URL:http://parcel-service:4002}
  auth:
    url: ${AUTH_SERVICE_URL:http://auth-service:4000}
